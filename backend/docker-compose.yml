services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ninamaria254
      POSTGRES_DB: running_app
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:ninamaria254@db:5432/running_app
    depends_on:
      - db
    ports:
      - "5002:5002"
volumes:
  pgdata:
